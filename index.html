<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Galeria Zdjęć</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h2>Dodaj zdjęcia</h2>
        <div>
            <button id="newSessionBtn">Nowa sesja</button>
            <button id="endSessionBtn" disabled>Zakończ sesję</button>
            <span id="sessionInfo"></span>
        </div>
        <div id="drop">
            Upuść pliki tutaj lub <input id="file" type="file" accept="image/*" multiple>
        </div>
        <div>
            <button id="downloadAll">Pobierz wszystkie (zip)</button>
        </div>
        <h3>Galeria</h3>
        <div id="gallery"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
